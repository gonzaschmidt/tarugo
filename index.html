<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarugo · Alquiler de herramientas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E5BB8}a:hover{color:#0F2F66}
button{cursor:pointer}
.desk-only{display:flex}
.mob-only{display:none}
.page-main{padding:28px 24px 96px}
.hero-title{font-size:36px}
.llave-fab{position:fixed;right:24px;bottom:24px;z-index:40}
.llave-panel{position:fixed;right:24px;bottom:24px;width:430px;height:min(720px, calc(100vh - 48px));z-index:50;border-radius:22px}
.detail-img{height:380px}
.map-box{height:380px}
.pin-label{display:inline}
@media (max-width: 760px){
.map-box{height:300px}
.pin-label{display:none}
.pin-on .pin-label{display:inline}
.desk-only{display:none}
.mob-only{display:flex}
.page-main{padding:18px 16px 120px}
.hero-title{font-size:28px}
.llave-fab{right:16px;bottom:90px}
.llave-panel{top:0;left:0;right:0;bottom:0;width:auto;height:auto;border-radius:0}
.detail-img{height:240px}
}
</style>
<style>#app{min-height:100vh}</style>
</head>
<body>
<template id="tpl"><sc-if value="{{ showLogin }}" hint-placeholder-val="{{ true }}">
<div style="min-height: 100vh; box-sizing: border-box; padding: 24px 16px; display: flex; align-items: center; justify-content: center; background: #0F2F66; font-family: 'DM Sans', sans-serif; color: #0F2F66">
<div style="width: 100%; max-width: 980px; display: flex; flex-wrap: wrap; overflow: hidden; background: #FFFFFF; border-radius: 26px; box-shadow: 0 24px 60px rgba(0,0,0,0.25)">
<div style="flex: 1 1 360px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; padding: 36px 32px; background: #1E5BB8; color: #FFFFFF">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><img src="/_blob/8cbf3e0b5370900932c9fe388d072ed1" alt="" style="width: 40px; height: 39px; object-fit: contain"></span>
<span style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.5px">TARUGO</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: Montserrat, sans-serif; font-size: 30px; line-height: 1.15; font-weight: 800">Herramientas a pocas cuadras, cuando las necesitás.</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #DCE7F8">Alquilá en tu barrio y retirá el mismo día en una ferretería de confianza.</p>
</div>
<div class="desk-only" style="flex-direction: column; gap: 14px">
<span style="display: flex; align-items: center; gap: 12px; font-size: 15px"><span style="flex: none; width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7M5 10v10h14V10"></path></svg></span>Retiro en el día en tu ferretería de barrio</span>
<span style="display: flex; align-items: center; gap: 12px; font-size: 15px"><span style="flex: none; width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"></path></svg></span>Kits armados para cada tarea</span>
<span style="display: flex; align-items: center; gap: 12px; font-size: 15px"><span style="flex: none; width: 36px; height: 36px; border-radius: 12px; background: #F28C28; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F2F66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"></path></svg></span>Llave te dice qué necesitás y cómo hacerlo</span>
</div>
</div>
<div style="flex: 1 1 360px; min-width: 0; box-sizing: border-box; margin: 0; display: flex; flex-direction: column; gap: 16px; padding: 36px 32px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: Montserrat, sans-serif; font-size: 28px; font-weight: 800">Ingresá a tu cuenta</h1>
<p style="margin: 0; font-size: 15px; color: #55627A">Usá tu usuario y tu contraseña de Tarugo.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="login-user" style="font-size: 14px; font-weight: 700">Usuario</label>
<input id="login-user" type="text" value="{{ loginUser }}" onChange="{{ onLoginUser }}" onInput="{{ onLoginUser }}" onKeyDown="{{ loginKey }}" autocomplete="username" placeholder="Tu nombre de usuario" style="height: 50px; padding: 0 14px; box-sizing: border-box; border: 1.5px solid {{ loginBorder }}; border-radius: 14px; background: #F4F6FA; font-family: 'DM Sans', sans-serif; font-size: 16px; color: #0F2F66">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="login-pass" style="font-size: 14px; font-weight: 700">Contraseña</label>
<div style="display: flex; align-items: center; gap: 6px; height: 50px; padding: 0 6px 0 14px; box-sizing: border-box; border: 1.5px solid {{ loginBorder }}; border-radius: 14px; background: #F4F6FA">
<input id="login-pass" type="{{ pwType }}" value="{{ loginPass }}" onChange="{{ onLoginPass }}" onInput="{{ onLoginPass }}" onKeyDown="{{ loginKey }}" autocomplete="current-password" placeholder="Tu contraseña" style="flex: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 16px; color: #0F2F66">
<button type="button" onClick="{{ togglePw }}" style="height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; color: #1E5BB8">{{ pwBtn }}</button>
</div>
</div>
<sc-if value="{{ loginError }}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #FDECEA; border: 1.5px solid #F2B8B2; border-radius: 12px; font-size: 14px; color: #8A1F14"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>Usuario o contraseña incorrectos. Probá de nuevo.</div>
</sc-if>
<button type="button" style="align-self: flex-end; border: 0; background: transparent; padding: 4px 0; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; color: #1E5BB8">¿Olvidaste tu contraseña?</button>
<button type="button" onClick="{{ doLogin }}" style="height: 54px; border: 0; border-radius: 16px; background: #F28C28; color: #0F2F66; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 16px">Ingresar</button>
<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #55627A"><span style="flex: 1; height: 1.5px; background: #E6EBF2"></span>¿No tenés cuenta?<span style="flex: 1; height: 1.5px; background: #E6EBF2"></span></div>
<button type="button" style="height: 50px; border: 1.5px solid #0F2F66; border-radius: 16px; background: #FFFFFF; color: #0F2F66; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 15px">Crear una cuenta gratis</button>
<div style="display: flex; gap: 10px; padding: 12px 14px; background: #EAF2FD; border-radius: 12px; font-size: 13px; line-height: 1.45; color: #3D4B66"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E5BB8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span>Cuenta de prueba · usuario <b>Nicolás</b> · contraseña <b>12345678</b></span></div>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}">
<div style="min-height: 100vh; background: #F4F6FA; font-family: 'DM Sans', sans-serif; color: #0F2F66">
<header style="background: #FFFFFF; border-bottom: 1.5px solid #E6EBF2">
<div style="max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
<button type="button" onClick="{{ goHome }}" aria-label="Tarugo, ir al inicio" style="display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 0">
<img src="/_blob/8cbf3e0b5370900932c9fe388d072ed1" alt="" style="width: 40px; height: 39px; object-fit: contain">
<span style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.5px; color: #0F2F66">TARUGO</span>
</button>
<div style="order: 3; flex: 1 1 280px; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; box-sizing: border-box; background: #F4F6FA; border: 1.5px solid #DCE3EE; border-radius: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55627A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<label for="buscar-web" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar</label>
<input id="buscar-web" type="text" value="{{ query }}" onInput="{{ onSearch }}" onChange="{{ onSearch }}" onKeyDown="{{ searchKey }}" placeholder="Buscá una herramienta o una tarea" autocomplete="off" style="flex: 1; min-width: 0; height: 40px; border: 0; outline: 0; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 15px; color: #0F2F66">
<sc-if value="{{ hasQuery }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ clearSearch }}" aria-label="Borrar la búsqueda" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: 17px; background: #E6EBF2; color: #0F2F66; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></sc-if>
</div>
<nav aria-label="Principal" class="desk-only" style="order: 4; flex-wrap: wrap; gap: 4px">
<sc-for list="{{ navItems }}" as="n" hint-placeholder-count="4">
<button type="button" onClick="{{ n.pick }}" style="{{ n.style }}">{{ n.label }}</button>
</sc-for>
</nav>
<button type="button" onClick="{{ goCuenta }}" style="order: 2; display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 0; text-align: left">
<span style="width: 42px; height: 42px; border-radius: 21px; background: #0F2F66; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 15px">N</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #0F2F66">Nicolás</span><span style="font-size: 12px; color: #55627A">Plan {{ planName }}</span></span>
</button>
</div>
</header>
<main class="page-main" style="max-width: 1200px; margin: 0 auto; box-sizing: border-box">
<sc-if value="{{ isBuscar }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h1 style="margin: 0; font-family: Montserrat, sans-serif; font-size: 26px; font-weight: 800">Resultados para “{{ query }}”</h1>
<button type="button" onClick="{{ clearSearch }}" style="border: 0; background: transparent; padding: 8px 0; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; color: #1E5BB8">Borrar búsqueda</button>
</div>
<sc-if value="{{ hasTaskHit }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 20px; background: #FFFFFF; border: 2px solid #F5C9A0; border-radius: 18px">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: Montserrat, sans-serif; font-size: 17px; font-weight: 800">Parece que querés {{ taskTitleLow }}</span><span style="font-size: 14px; color: #55627A">Llave te arma la lista de lo que necesitás y el paso a paso.</span></div>
<button type="button" onClick="{{ askTask }}" style="height: 46px; padding: 0 18px; border: 0; border-radius: 14px; background: #0F2F66; color: #FFFFFF; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 14px">Preguntarle a Llave</button>
</div>
</sc-if>
<span style="font-size: 14px; color: #55627A">{{ resultsTxt }}</span>
<sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px">
<sc-for list="{{ results }}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{ t.open }}" style="display: flex; flex-direction: column; padding: 0; overflow: hidden; background: #FFFFFF; border: 1.5px solid #E6EBF2; border-radius: 18px; text-align: left; font-family: 'DM Sans', sans-serif; color: #0F2F66">
<sc-if value="{{ t.hasImg }}" hint-placeholder-val="{{ false }}"><span style="width: 100%; height: 160px; box-sizing: border-box; padding: 10px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border-bottom: 1.5px solid #EEF1F6"><img src="{{ t.img }}" alt="{{ t.short }}" style="max-width: 100%; max-height: 100%; object-fit: contain"></span></sc-if>
<sc-if value="{{ t.noImg }}" hint-placeholder-val="{{ true }}"><span style="{{ t.panel }}"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="{{ t.stroke }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.d }}"></path></svg></span></sc-if>
<span style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px; width: 100%; box-sizing: border-box">
<span style="font-size: 16px; font-weight: 700">{{ t.short }}</span>
<span style="font-size: 13px; color: #55627A">{{ t.owner }} · {{ t.dist }}</span>
<span style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px">
<span style="{{ t.badgeStyle }}">{{ t.badge }}</span>
<span style="font-size: 16px; font-weight: 700">{{ t.priceTxt }} <span style="font-size: 12px; font-weight: 500; color: #55627A">por día</span></span>
</span>
</span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 22px; background: #FFFFFF; border: 1.5px solid #E6EBF2; border-radius: 18px">
<span style="font-family: Montserrat, sans-serif; font-size: 18px; font-weight: 800">No encontramos “{{ query }}” cerca tuyo</span>
<span style="font-size: 14px; color: #55627A">Probá con otra palabra (taladro, escalera, pintar, destapar) o contale a Llave qué querés hacer.</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ suggestions }}" as="sg" hint-placeholder-count="4"><button type="button" onClick="{{ sg.pick }}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #DCE3EE; background: #F4F6FA; color: #0F2F66; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 14px">{{ sg.label }}</button></sc-for>
</div>
<button type="button" onClick="{{ askQuery }}" style="height: 46px; padding: 0 18px; border: 0; border-radius: 14px; background: #F28C28; color: #0F2F66; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 14px">Preguntarle a Llave</button>
</div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{ isInicioPlain }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="hero-title" style="margin: 0; font-family: Montserrat, sans-serif; line-height: 1.1; font-weight: 800">¿Qué querés resolver hoy?</h1>
<p style="margin: 0; font-size: 17px; color: #55627A">Herramientas a pocas cuadras, listas para retirar en tu ferretería de barrio.</p>
</div>
<button type="button" onClick="{{ openMap }}" aria-label="Cambiar tu ubicación, ahora {{ locName }}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; border: 1.5px solid #DCE3EE; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; color: #0F2F66"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E8700F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>{{ locName }}<span style="font-weight: 700; color: #1E5BB8">· Cambiar</span></button>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 22px; background: #FFFFFF; border: 2px solid #F5C9A0; border-radius: 20px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="flex: none; width: 52px; height: 52px; border-radius: 26px; background: #0F2F66; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F28C28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 3px"><span style="font-family: Montserrat, sans-serif; font-size: 19px; font-weight: 800">¿No sabés qué necesitás? Preguntale a Llave</span><span style="font-size: 14px; color: #55627A">Te dice qué hace falta, dónde conseguirlo cerca, cuánto sale y cómo hacerlo paso a paso.</span></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="4"><button type="button" onClick="{{ c.ask }}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #DCE3EE; background: #F4F6FA; color: #0F2F66; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 14px">{{ c.label }}</button></sc-for>
</div>
</div>
<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: Montserrat, sans-serif; font-size: 21px; font-weight: 800">Kits por tarea</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px">
<sc-for list="{{ kits }}" as="k" hint-placeholder-count="4">
<button type="button" onClick="{{ k.open }}" style="display: flex; align-items: center; gap: 14px; padding: 16px; background: #FFFFFF; border: 1.5px solid #E6EBF2; border-radius: 18px; text-align: left; font-family: 'DM Sans', sans-serif; color: #0F2F66">
<sc-if value="{{ k.hasImg }}" hint-placeholder-val="{{ false }}"><img src="{{ k.img }}" alt="" style="flex: none; width: 64px; height: 64px; border-radius: 14px; object-fit: contain; background: #FFFFFF; border: 1.5px solid #EEF1F6"></sc-if>
<sc-if value="{{ k.noImg }}" hint-placeholder-val="{{ true }}"><span style="{{ k.bubble }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{ k.stroke }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ k.d }}"></path></svg></span></sc-if>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 700">{{ k.name }}</span><span style="font-size: 13px; color: #55627A">{{ k.items }}</span></span>
</button>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 style="margin: 0; font-family: Montserrat, sans-serif; font-size: 21px; font-weight: 800">Cerca tuyo</h2>
<button type="button" onClick="{{ openMap }}" style="border: 0; background: transparent; padding: 6px 0; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #55627A">{{ nearTxt }} · <span style="font-weight: 700; color: #1E5BB8">Ver en el mapa</span></button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px">
<sc-for list="{{ nearTools }}" as="t" hint-placeholder-count="6">
<button type="button" onClick="{{ t.open }}" style="display: flex; flex-direction: column; padding: 0; overflow: hidden; background: #FFFFFF; border: 1.5px solid #E6EBF2; border-radius: 18px; text-align: left; font-family: 'DM Sans', sans-serif; color: #0F2F66">
<sc-if value="{{ t.hasImg }}" hint-placeholder-val="{{ false }}"><span style="width: 100%; height: 160px; box-sizing: border-box; padding: 10px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border-bottom: 1.5px solid #EEF1F6"><img src="{{ t.img }}" alt="{{ t.short }}" style="max-width: 100%; max-height: 100%; object-fit: contain"></span></sc-if>
<sc-if value="{{ t.noImg }}" hint-placeholder-val="{{ true }}"><span style="{{ t.panel }}"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="{{ t.stroke }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.d }}"></path></svg></span></sc-if>

</div>
<sc-if value="{{ pubError }}" hint-placeholder-val="{{ false }}">
<div role="alert" style="padding: 12px 14px; background: #FDECEA; border: 1.5px solid #F2B8B2; border-radius: 12px; font-size: 14px; color: #8A1F14">{{ pubErrorTxt }}</div>
</sc-if>
</div>
<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 700; color: #55627A; text-transform: uppercase; letter-spacing: 0.6px">Así la van a ver</span>

<span style="{{ pubPreview.panel }}"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="{{ pubPreview.stroke }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ pubPreview.d }}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px">
<span style="font-size: 16px; font-weight: 700">{{ pubPreview.name }}</span>
<span style="font-size: 13px; color: #55627A">{{ pubPreview.where }}</span>
<span style="font-size: 16px; font-weight: 700">{{ pubPreview.price }} <span style="font-size: 12px; font-weight: 500; color: #55627A">por día</span></span>
</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; background: #FFF1E4; border-radius: 16px">
<span style="font-size: 14px; color: #6B3A10">Por cada día de alquiler cobrás</span>
<span style="font-family: Montserrat, sans-serif; font-size: 26px; font-weight: 800">{{ pubEarn }}</span>
<span style="font-size: 13px; line-height: 1.4; color: #6B3A10">Tarugo se queda con el 5%. La fianza ({{ pubDeposit }}) la cobra la app y te cubre si hay daños.</span>
</div>
<button type="button" onClick="{{ doPublish }}" style="height: 54px; border: 0; border-radius: 16px; background: #F28C28; color: #0F2F66; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 16px">Publicar herramienta</button>
</div>
</div>
</div>
</sc-if>
</main>
<footer style="border-top: 1.5px solid #E6EBF2; background: #FFFFFF">
<div style="max-width: 1200px; margin: 0 auto; padding: 18px 16px 100px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: #55627A"><span>Tarugo · Alquiler de herramientas en tu barrio</span><span>Prototipo: precios, nombres y reseñas de ejemplo</span></div>
</footer>
<sc-if value="{{ showFab }}" hint-placeholder-val="{{ true }}">
<button type="button" class="llave-fab" onClick="{{ openLlave }}" style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px 0 8px; border: 0; border-radius: 28px; background: #0F2F66; color: #FFFFFF; box-shadow: 0 10px 28px rgba(15,47,102,0.35); font-family: Montserrat, sans-serif; font-weight: 800; font-size: 15px">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #F28C28; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2F66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"></path></svg></span>
Preguntale a Llave
</button>
</sc-if>
<sc-if value="{{ llaveOpen }}" hint-placeholder-val="{{ false }}">

<span style="flex: none; width: 42px; height: 42px; border-radius: 21px; background: #F28C28; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2F66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-family: Montserrat, sans-serif; font-size: 17px; font-weight: 800; color: #FFFFFF">Llave</span><span style="font-size: 12px; color: #C9D6EC">Asistente con IA de Tarugo</span></span>
<button type="button" onClick="{{ closeLlave }}" aria-label="Cerrar Llave" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.12); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<div ref="{{ bodyRef }}" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #F4F6FA">
<div style="align-self: flex-start; max-width: 88%; padding: 12px 14px; background: #FFFFFF; border: 1.5px solid #E6EBF2; border-radius: 4px 16px 16px 16px; font-size: 14px; line-height: 1.5">Hola, soy Llave. Contame qué querés arreglar y te digo qué necesitás, dónde conseguirlo cerca, cuánto sale y cómo hacerlo paso a paso.</div>
<sc-for list="{{ messages }}" as="m" hint-placeholder-count="0">
<sc-if value="{{ m.isUser }}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-end; max-width: 85%; padding: 10px 14px; background: #1E5BB8; color: #FFFFFF; border-radius: 16px 4px 16px 16px; font-size: 14px; line-height: 1.45">{{ m.text }}</div>
</sc-if>
<sc-if value="{{ m.isText }}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; max-width: 88%; padding: 12px 14px; background: #FFFFFF; border: 1.5px solid #E6EBF2; border-radius: 4px 16px 16px 16px; font-size: 14px; line-height: 1.5">{{ m.text }}</div>
</sc-if>
<sc-if value="{{ m.isPlan }}" hint-placeholder-val="{{ false }}">
<div style="align-self: stretch; display: flex; flex-direction: column; gap: 12px; padding: 14px; background: #FFFFFF; border: 1.5px solid #E6EBF2; border-radius: 4px 16px 16px 16px">
<span style="font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 800">{{ m.title }}</span>
<span style="font-size: 14px; line-height: 1.5; color: #3D4B66">{{ m.intro }}</span>
<span style="font-size: 12px; font-weight: 700; color: #55627A; text-transform: uppercase; letter-spacing: 0.6px">Lo que necesitás · tocá el círculo si ya lo tenés</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{ m.items }}" as="it" hint-placeholder-count="4">
<div style="{{ it.rowStyle }}">
<button type="button" onClick="{{ it.toggle }}" aria-pressed="{{ it.owned }}" aria-label="{{ it.toggleLabel }}" style="{{ it.checkStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg></button>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="{{ it.tagStyle }}">{{ it.tag }}</span><span style="{{ it.nameStyle }}">{{ it.name }}</span></span>
<span style="font-size: 12px; color: #55627A">{{ it.where }}</span>
</span>
<span style="flex: none; font-size: 14px; font-weight: 700">{{ it.priceTxt }}</span>
</div>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px; background: #F4F6FA; border-radius: 12px"><span style="font-size: 13px; color: #3D4B66">Te falta conseguir</span><span style="font-family: Montserrat, sans-serif; font-size: 18px; font-weight: 800">{{ m.totalTxt }}</span></div>
<span style="font-size: 12px; font-weight: 700; color: #55627A; text-transform: uppercase; letter-spacing: 0.6px">Paso a paso</span>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.45; color: #0F2F66">
<sc-for list="{{ m.steps }}" as="st" hint-placeholder-count="5"><li>{{ st.t }}</li></sc-for>
</ol>
<div style="display: flex; gap: 8px; padding: 10px 12px; background: #FFF1E4; border-radius: 12px; font-size: 13px; line-height: 1.45; color: #6B3A10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A84A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"></path></svg>{{ m.tip }}</div>
<button type="button" onClick="{{ m.cta }}" style="min-height: 48px; padding: 8px 16px; border: 0; border-radius: 14px; background: #F28C28; color: #0F2F66; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 14px">{{ m.ctaLabel }}</button>
</div>
</sc-if>
</sc-for>
<sc-if value="{{ typing }}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; padding: 10px 14px; background: #FFFFFF; border: 1.5px solid #E6EBF2; border-radius: 4px 16px 16px 16px; font-size: 13px; color: #55627A">Llave está escribiendo…</div>
</sc-if>
</div>
<div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 14px; border-top: 1.5px solid #E6EBF2; background: #FFFFFF">
<div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="4"><button type="button" onClick="{{ c.ask }}" style="flex: none; height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid #DCE3EE; background: #F4F6FA; color: #0F2F66; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 13px">{{ c.label }}</button></sc-for>
</div>
<div style="display: flex; gap: 8px; margin: 0">
<label for="llave-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Escribile a Llave</label>
<input id="llave-input" type="text" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ draftKey }}" placeholder="Ej.: quiero pintar mi cuarto" autocomplete="off" style="flex: 1; min-width: 0; height: 46px; padding: 0 14px; box-sizing: border-box; border: 1.5px solid #DCE3EE; border-radius: 14px; background: #F4F6FA; font-family: 'DM Sans', sans-serif; font-size: 15px; color: #0F2F66">
<button type="button" onClick="{{ send }}" aria-label="Enviar" style="flex: none; width: 46px; height: 46px; border: 0; border-radius: 14px; background: #1E5BB8; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12 20 4l-4 16-4-7z"></path><path d="m12 13 8-9"></path></svg></button>
</div>
<span style="font-size: 11px; color: #55627A; text-align: center">Simulación: Llave responde con ejemplos y precios ficticios.</span>
</div>
</section>
</sc-if>
<sc-if value="{{ mapOpen }}" hint-placeholder-val="{{ false }}">

</sc-for>
<span style="position: absolute; right: 10px; bottom: 10px; font-size: 11px; color: #55627A; background: rgba(255,255,255,0.85); padding: 3px 8px; border-radius: 8px">Mapa ilustrativo de CABA</span>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1.5px solid #E6EBF2">

<button type="button" onClick="{{ confirmMap }}" style="height: 50px; padding: 0 24px; border: 0; border-radius: 14px; background: #F28C28; color: #0F2F66; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 15px">Confirmar ubicación</button>
</div>
</section>
</div>
</sc-if>
<sc-if value="{{ planModal }}" hint-placeholder-val="{{ false }}">

<section role="dialog" aria-modal="true" aria-label="{{ pc.title }}" style="width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 24px; background: #FFFFFF; border-radius: 22px">

matchKey(text) {
const t = String(text || '').toLowerCase();
if (/pint|pared|latex|látex|rodillo/.test(t)) return 'pintar';
if (/tap|cañer|caner|pileta|desag|inodoro|ducha/.test(t)) return 'destapar';
if (/estante|colgar|cuadro|repisa|agujer|taladr|amur/.test(t)) return 'estante';
if (/mueble|armar|placard|cama|escritorio|ropero/.test(t)) return 'mueble';
return null;
}
ask(text) {
const clean = String(text || '').trim();

const self = this;
this.setState({ llaveOpen: true, typing: true, draft: '', chat: this.state.chat.concat([{ from: 'user', text: clean }]) });

self.setState({ typing: false, chat: self.state.chat.concat([reply]) });
}, 1100);

name: p.name, price: p.price, per: p.per, desc: p.desc, highlight: p.highlight,
features: p.features.map((t) => ({ t: t })),
cardStyle: 'display: flex; flex-direction: column; gap: 10px; padding: 20px; background: #FFFFFF; border-radius: 20px; border: ' + (p.highlight ? '2px solid #F28C28' : '1.5px solid #E6EBF2'),
btnLabel: current ? 'Tu plan actual' : (p.id === 'basico' ? 'Volver a Básico' : 'Elegir ' + p.name),
btnStyle: current
? 'height: 48px; border-radius: 14px; border: 1.5px solid #DCE3EE; background: #F4F6FA; color: #55627A; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 15px'
: (p.highlight
? 'height: 48px; border-radius: 14px; border: 0; background: #F28C28; color: #0F2F66; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 15px'
: 'height: 48px; border-radius: 14px; border: 1.5px solid #1E5BB8; background: #FFFFFF; color: #1E5BB8; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 15px'),
choose: () => { if (!current) self.setState({ pendingPlan: p.id, planMsg: '' }); }
};
});

const rank = { basico: 0, plus: 1, pro: 2 };
let pc = { title: '', from: '', fromPrice: '', to: '', toPrice: '', listTitle: '', items: [], mark: '', markStyle: '', note: '', cta: '', ctaBg: '#F28C28', ctaColor: '#0F2F66' };
if (s.pendingPlan) {
const cur = planData.find((p) => p.id === plan);
const nxt = planData.find((p) => p.id === s.pendingPlan);
const up = rank[nxt.id] > rank[cur.id];
const markSt = 'flex: none; width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; ' + (rank[nxt.id] > rank[cur.id] ? 'background: #E8F0FB; color: #1E5BB8' : 'background: #FDECEA; color: #B3261E');
const priceOf = (p) => p.id === 'basico' ? 'Gratis' : p.price + ' por mes';
pc = {
title: up ? '¿Pasar al plan ' + nxt.name + '?' : '¿Cambiar al plan ' + nxt.name + '?',
from: cur.name, fromPrice: priceOf(cur),
to: nxt.name, toPrice: priceOf(nxt),
listTitle: up ? 'Qué ganás' : 'Qué dejás de tener',
items: (up ? nxt.features : cur.features).map((t) => ({ t: t, mark: up ? '+' : '–', markStyle: markSt })),
mark: '',
markStyle: 'flex: none; width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; ' + (up ? 'background: #E8F0FB; color: #1E5BB8' : 'background: #FDECEA; color: #B3261E'),
note: up
? 'Se cobran ' + nxt.price + ' hoy con Mercado Pago y se renueva todos los meses. Podés cancelar cuando quieras, sin costo.'
: 'Tu plan ' + cur.name + ' sigue activo hasta el final del mes que ya pagaste. Después pasás a ' + nxt.name + '.',
cta: up ? 'Confirmar y pagar ' + nxt.price : 'Sí, cambiar a ' + nxt.name,
ctaBg: up ? '#F28C28' : '#1E5BB8',
ctaColor: up ? '#0F2F66' : '#FFFFFF'
};
}

const rentals = s.rentals.map((r) => Object.assign({}, r, {
img: IMG[r.tool] || '', hasImg: !!IMG[r.tool], noImg: !IMG[r.tool],
pillStyle: r.active
? 'font-size: 13px; font-weight: 700; color: #A84A00; background: #FFF1E4; padding: 6px 12px; border-radius: 12px'
: 'font-size: 13px; font-weight: 700; color: #1E5BB8; background: #E8F0FB; padding: 6px 12px; border-radius: 12px'
}));

const ld = this.llaveData();
const chipList = ['¿Cómo pinto una pared?', 'Se me tapó la pileta', 'Quiero colgar un estante', 'Tengo que armar un mueble'];
const chips = chipList.map((label) => ({ label: label, ask: () => self.ask(label) }));
const messages = s.chat.map((m, idx) => {
if (m.from === 'user') return { isUser: true, isText: false, isPlan: false, text: m.text };
if (!m.plan) return { isUser: false, isText: true, isPlan: false, text: m.text };
const sc = ld[m.plan];
let missing = 0;
const items = sc.items.map((it) => {
const key = idx + '-' + it.id;
const owned = !!s.have[key];
if (!owned) missing += it.price;
return {
name: it.name,
where: it.where,
tag: it.rent ? 'Alquilar' : 'Comprar',
tagStyle: it.rent
? 'font-size: 11px; font-weight: 700; color: #FFFFFF; background: #1E5BB8; padding: 2px 8px; border-radius: 8px'
: 'font-size: 11px; font-weight: 700; color: #A84A00; background: #FFF1E4; padding: 2px 8px; border-radius: 8px',
nameStyle: 'font-size: 14px; font-weight: 700; ' + (owned ? 'text-decoration: line-through; color: #55627A' : 'color: #0F2F66'),
rowStyle: 'display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1.5px solid #EEF1F6; background: ' + (owned ? '#F4F6FA' : '#FFFFFF'),
priceTxt: owned ? 'Ya lo tenés' : fmt(it.price),
owned: owned,
toggleLabel: owned ? 'Marcar ' + it.name + ' como que no lo tengo' : 'Marcar ' + it.name + ' como que ya lo tengo',
checkStyle: 'flex: none; width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; padding: 0; ' + (owned ? 'border: 0; background: #1E5BB8; color: #FFFFFF' : 'border: 1.5px solid #B9C3D3; background: #FFFFFF; color: transparent'),
toggle: () => { const h = Object.assign({}, self.state.have); h[key] = !h[key]; self.setState({ have: h }); }
};
});
return {
isUser: false, isText: false, isPlan: true,
title: sc.title, intro: sc.intro, tip: sc.tip, ctaLabel: sc.ctaLabel,
items: items,
steps: sc.steps.map((t) => ({ t: t })),
totalTxt: fmt(missing),
cta: () => {
const ex = {};
sc.items.forEach((it) => { if (it.extra && !self.state.have[idx + '-' + it.id]) ex[it.extra] = true; });
self.go('detalle', { toolId: sc.tool, days: sc.days, extras: ex, llaveOpen: false });
}
};
});

const normT = (x) => self.normUser(x);
const q = normT(s.query);
const words = q.split(/\s+/).filter((w) => w.length >= 3);
const ldAll = self.llaveData();
const wordHit = (t) => {
const hay = normT(t.short + ' ' + t.name + ' ' + t.use + ' ' + t.owner);
return words.length ? words.some((w) => hay.indexOf(w) >= 0 || hay.indexOf(w.slice(0, -1)) >= 0) : hay.indexOf(q) >= 0;
};
const directHits = q ? tools.filter((t) => normT(t.short + ' ' + t.name).split(/\s+/).some((x) => words.some((w) => x.indexOf(w) === 0 || w.indexOf(x) === 0 && x.length >= 4))) : [];
const taskKey = q && directHits.length === 0 ? self.matchKey(q) : null;
const results = q ? tools.filter((t) => wordHit(t) || (taskKey && ldAll[taskKey].tool === t.id)) : [];
const sugList = ['Taladro', 'Escalera', 'Hidrolavadora', 'Pintar una pared'];

const cats = self.catsData();
const pub = s.pub;
const pcat = cats.find((c) => c.id === pub.cat) || cats[0];
const priceNum = parseInt(String(pub.price || '').replace(/[^0-9]/g, ''), 10) || 0;
const chipSt = (on) => 'height: 42px; padding: 0 16px; border-radius: 21px; font-family: DM Sans, sans-serif; font-weight: 700; font-size: 14px; ' + (on ? 'border: 1.5px solid #1E5BB8; background: #1E5BB8; color: #FFFFFF' : 'border: 1.5px solid #DCE3EE; background: #F4F6FA; color: #0F2F66');
const pickSt = (on) => 'display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; border-radius: 14px; text-align: left; font-family: DM Sans, sans-serif; color: #0F2F66; ' + (on ? 'border: 2px solid #1E5BB8; background: #EAF2FD' : 'border: 1.5px solid #DCE3EE; background: #FFFFFF');
const myTools = s.myTools.map((m) => {
const c = cats.find((x) => x.id === m.cat) || cats[5];
return Object.assign({}, m, {
d: c.d,
stroke: c.blue ? '#1E5BB8' : '#C2560A',
bubble: 'flex: none; width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: ' + (c.blue ? '#E8F0FB' : '#FFF1E4'),
pillStyle: 'font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 10px; ' + (m.live ? 'color: #1D5E33; background: #E6F4EA' : 'color: #A84A00; background: #FFF1E4')
});
});

return {
query: s.query,
hasQuery: !!q,
isBuscar: s.view === 'inicio' && !!q,
isInicioPlain: s.view === 'inicio' && !q,
results: results,
hasResults: results.length > 0,
noResults: !!q && results.length === 0,
resultsTxt: results.length === 1 ? '1 herramienta cerca tuyo' : results.length + ' herramientas cerca tuyo',
hasTaskHit: !!taskKey,
taskTitleLow: taskKey ? ldAll[taskKey].title.toLowerCase() : '',
askTask: () => { if (taskKey) self.ask(s.query); },
askQuery: () => self.ask(s.query),
suggestions: sugList.map((l) => ({ label: l, pick: () => self.setState({ query: l }) })),
onSearch: (e) => { const v = e && e.target ? e.target.value : ''; self.setState(v.trim() ? { query: v, view: 'inicio' } : { query: v }); },
searchKey: (e) => { if (e && e.key === 'Enter') { if (e.preventDefault) e.preventDefault(); const v = self.domVal('buscar-web', self.state.query); self.go('inicio', { query: v, llaveOpen: false }); } },
clearSearch: () => self.setState({ query: '' }),
isPublicar: s.view === 'publicar',
goPublicar: () => self.go('publicar', { llaveOpen: false, pubError: '' }),
myTools: myTools,
hasPubMsg: !!s.pubMsg,
pubMsg: s.pubMsg,
pubCats: cats.map((c) => ({ label: c.label, on: c.id === pub.cat, style: chipSt(c.id === pub.cat), pick: () => self.setPub({ cat: c.id }) })),
pubConds: [['nueva', 'Como nueva'], ['buen', 'Buen estado'], ['uso', 'Con uso']].map((c) => ({ label: c[1], on: c[0] === pub.cond, style: chipSt(c[0] === pub.cond), pick: () => self.setPub({ cond: c[0] }) })),
pubPickups: [['ferreteria', 'En una ferretería cercana (recomendado)', 'Ferretería La Esquina, a 350 m: la revisa, la entrega y la recibe por vos.'], ['casa', 'En mi casa', 'Coordinás el horario con quien la alquila.']].map((c) => ({ label: c[1], note: c[2], on: c[0] === pub.pickup, style: pickSt(c[0] === pub.pickup), pick: () => self.setPub({ pickup: c[0] }) })),
pubPhotos: Array.from({ length: pub.photos }, (_, i) => ({ n: i + 1 })),
addPhoto: () => { if (self.state.pub.photos < 4) self.setPub({ photos: self.state.pub.photos + 1 }); },
pubName: pub.name,
pubPrice: pub.price,
pubDesc: pub.desc,
onPubName: (e) => self.setPub({ name: e && e.target ? e.target.value : '' }),
onPubPrice: (e) => self.setPub({ price: e && e.target ? e.target.value : '' }),
onPubDesc: (e) => self.setPub({ desc: e && e.target ? e.target.value : '' }),
pubNameBorder: s.pubError && !pub.name.trim() ? '#D9534F' : '#DCE3EE',
pubPriceBorder: s.pubError && !priceNum ? '#D9534F' : '#DCE3EE',
pubSuggest: 'En tu zona, una herramienta así se alquila entre ' + fmt(pcat.sug[0]) + ' y ' + fmt(pcat.sug[1]) + ' por día.',
pubEarn: priceNum ? fmt(Math.round(priceNum * 0.95)) : '$0',
pubDeposit: priceNum ? fmt(priceNum * 7) : 'unas 7 veces el precio por día',
pubError: !!s.pubError,
pubErrorTxt: s.pubError,
pubPreview: {
name: pub.name.trim() || 'Nombre de tu herramienta',
where: pub.pickup === 'ferreteria' ? 'Ferretería La Esquina · 350 m' : 'Nicolás, vecino · tu casa',
price: priceNum ? fmt(priceNum) : '$—',
d: pcat.d,
stroke: pcat.blue ? '#1E5BB8' : '#C2560A',
panel: 'width: 100%; height: 140px; display: flex; align-items: center; justify-content: center; background: ' + (pcat.blue ? '#E8F0FB' : '#FFF1E4')
},
doPublish: () => self.publish(),
showLogin: !s.loggedIn,
loggedIn: s.loggedIn,
loginUser: s.loginUser,
loginPass: s.loginPass,
loginError: s.loginError,
loginBorder: s.loginError ? '#D9534F' : '#DCE3EE',
pwType: s.showPw ? 'text' : 'password',
pwBtn: s.showPw ? 'Ocultar' : 'Ver',
togglePw: () => self.setState({ showPw: !self.state.showPw }),
onLoginUser: (e) => self.setState({ loginUser: e && e.target ? e.target.value : '', loginError: false }),
onLoginPass: (e) => self.setState({ loginPass: e && e.target ? e.target.value : '', loginError: false }),
loginKey: (e) => { if (e && e.key === 'Enter') { if (e.preventDefault) e.preventDefault(); self.tryLogin(e); } },
doLogin: (e) => self.tryLogin(e),
draftKey: (e) => { if (e && e.key === 'Enter') { if (e.preventDefault) e.preventDefault(); self.ask(self.state.draft); } },
logout: () => self.go('inicio', { loggedIn: false, loginUser: '', loginPass: '', loginError: false, llaveOpen: false, mapOpen: false, pendingPlan: null }),
locName: locObj.name + ', CABA',
nearTools: nearTools,
nearTxt: nearTxt,
mapOpen: s.mapOpen,
barrios: barrios,
radiusOptions: radiusOptions,
mapPickName: pickObj.name,
openMap: () => self.setState({ mapOpen: true, mapPick: self.state.loc, located: false, llaveOpen: false }),
closeMap: () => self.setState({ mapOpen: false }),
confirmMap: () => self.setState({ mapOpen: false, loc: self.state.mapPick }),
locateLabel: s.locating ? 'Buscando dónde estás…' : 'Usar mi ubicación actual',
locateNote: s.located ? 'Te encontramos en ' + pickObj.name + '.' : 'Simulación: en la app real usa el GPS del celular.',
locateMe: () => {
if (self.state.locating) return;
self.setState({ locating: true });
if (self._timer) clearTimeout(self._timer);
self._timer = setTimeout(() => self.setState({ locating: false, located: true, mapPick: 'palermo' }), 900);
},
planModal: !!s.pendingPlan,
pc: pc,
cancelPlan: () => self.setState({ pendingPlan: null }),
confirmPlan: () => {
const np = self.state.pendingPlan;
if (!np) return;
const nm = names[np];
self.setState({ plan: np, pendingPlan: null, planMsg: np === 'basico' ? 'Listo, pasás al plan Básico al terminar el mes.' : 'Listo, ya tenés el plan ' + nm + '. Te mandamos el comprobante por mail.' });
},
hasPlanMsg: !!s.planMsg,
planMsg: s.planMsg,
extrasCountTxt: extrasSum > 0 ? 'Sumaste ' + raw.extras.filter((e) => s.extras[e.id]).length + ' · ' + fmt(extrasSum) : 'Consumibles de la ferretería',
feeProtTxt: (fee === 0 ? 'sin tarifa de servicio' : 'tarifa ' + fmt(fee)) + (protAmt > 0 ? ' y protección ' + fmt(protAmt) : (protIncluded ? ' · protección incluida' : '')),
isInicio: s.view === 'inicio',
isDetalle: s.view === 'detalle',
isReserva: s.view === 'reserva',
isListo: s.view === 'listo',
isPerfil: s.view === 'perfil',
tabCuenta: s.tab === 'cuenta',
tabAlquileres: s.tab === 'alquileres',
tabMembresias: s.tab === 'membresias',
tabHerramientas: s.tab === 'herramientas',
navItems: navItems,
mobTabs: mobTabs,
tabs: tabs,
kits: kits,
tools: tools,
tool: tool,
extras: extras,
dayOptions: dayOptions,
plans: plans,
rentals: rentals,
rentalCount: String(s.rentals.length),
planName: names[plan],
isBasico: plan === 'basico',
protIncluded: protIncluded,
prot: s.prot,
hasExtras: extrasSum > 0,
daysLabel: s.days === 1 ? '1 día' : s.days + ' días',
retiroTxt: retiroTxt,
devolucionTxt: devolucionTxt,
retiroLow: retiroTxt.toLowerCase(),
devolucionLow: devolucionTxt.toLowerCase(),
rentalTxt: fmt(rental),
extrasTxt: fmt(extrasSum),
ratePct: Math.round(rates[plan] * 100) + '%',
feeTxt: fee === 0 ? 'Sin cargo' : fmt(fee),
protTxt: s.prot ? fmt(Math.round(rental * 0.05)) : 'No incluida',
totalTxt: fmt(total),
ownerTxt: fmt(owner),
appTxt: fmt(app),
protFundTxt: protIncluded ? 'Cubre tu plan' : fmt(protAmt),
plusSavingTxt: fmt(plusSaving),
depositTitle: deposit > 0 ? 'Fianza retenida: ' + fmt(deposit) : 'Sin fianza con tu plan Pro',
depositNote: deposit > 0 ? 'Se reserva en tu medio de pago y se libera cuando devolvés la herramienta en buen estado. No es un cobro.' : 'Tu membresía Pro reemplaza la fianza en este alquiler.',
depositShort: deposit > 0 ? 'Fianza de ' + fmt(deposit) + ' retenida' : 'Sin fianza',
llaveOpen: s.llaveOpen,
showFab: !s.llaveOpen,
typing: s.typing,
draft: s.draft,
chips: chips,
messages: messages,
bodyRef: (el) => { self._body = el; },
openLlave: openLlave,
closeLlave: () => self.setState({ llaveOpen: false }),
onDraft: (e) => self.setState({ draft: e && e.target ? e.target.value : '' }),
send: (e) => { if (e && e.preventDefault) e.preventDefault(); self.ask(self.state.draft); },
goHome: () => self.go('inicio', { llaveOpen: false }),
goDetalle: () => self.go('detalle'),
goReserva: () => self.go('reserva'),
goCuenta: () => self.go('perfil', { tab: 'cuenta', llaveOpen: false }),
goAlquileres: () => self.openPerfil('alquileres'),
goMembresias: () => self.go('perfil', { tab: 'membresias', llaveOpen: false }),
goHerramientas: () => self.openPerfil('herramientas'),
toggleProt: () => self.setState({ prot: !self.state.prot }),
pay: () => {
const nuevo = { id: 'r' + Date.now(), tool: raw.id, name: raw.short, owner: raw.owner, when: 'retiro ' + retiroTxt.toLowerCase() + ', devolución ' + devolucionTxt.toLowerCase(), status: 'Activo', active: true, d: raw.d };
self.go('listo', { rentals: [nuevo].concat(self.state.rentals) });
}
};
}
}
window.__boot(Component);
</script>
</body>
</html>
